<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Acoustic Resonator: Precision concentric billet geometry -->
  <circle cx="200" cy="250" r="150" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <circle cx="200" cy="250" r="130" fill="#dbdad9" />
  <circle cx="200" cy="250" r="110" fill="#ffffff" stroke="#808080" stroke-width="1" />
  <circle cx="200" cy="250" r="85" fill="#dbdad9" stroke="#000000" stroke-width="1" />
  <circle cx="200" cy="250" r="60" fill="#000000" />
  <circle cx="200" cy="250" r="30" fill="#ffffff" />
  <circle cx="200" cy="250" r="8" fill="#000000" />

  <!-- Quadrant Hairlines -->
  <line x1="200" y1="100" x2="200" y2="400" stroke="#808080" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="50" y1="250" x2="350" y2="250" stroke="#808080" stroke-width="1" stroke-dasharray="4 4" />
</svg>
